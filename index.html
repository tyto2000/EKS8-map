<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mapa povrchů – Supabase viewer + Tool</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root{--bg:#0b1220;--panel:#0f172a;--border:#1f2937;--txt:#e5e7eb;--muted:#9ca3af;--tab:#111827;--tab-act:#1f2937;--accent:#22c55e;--err:#b91c1c}
    *{box-sizing:border-box} html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif} #app{display:flex;flex-direction:column;height:100%}
    .tabs{display:flex;gap:8px;padding:8px;background:var(--panel);border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap}.tab{appearance:none;border:1px solid var(--border);background:var(--tab);color:var(--txt);padding:8px 12px;border-radius:10px;cursor:pointer;font:inherit}.tab.active{background:var(--tab-act);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}.tabs .spacer{flex:1}
    .auth{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.auth input{width:170px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:#0b1020;color:var(--txt)}.auth button{padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:#111827;color:var(--txt);cursor:pointer}.auth .primary{background:#16a34a;border-color:#16a34a;color:#041407;font-weight:700}.auth .danger{background:#b91c1c;border-color:#b91c1c;color:#fff}.authStatus{font-size:12px;color:var(--muted)}
    #viewerWrap{position:relative;display:flex;flex-direction:column;height:100%}#map{flex:1}#banner{position:fixed;top:58px;left:50%;transform:translateX(-50%);background:#111827;color:#e5e7eb;padding:8px 12px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.35);font-size:14px;z-index:1000}#banner.error{background:#7f1d1d}#banner small{color:#9ca3af}
    #legend{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);color:#111827;border-top:1px solid #e5e7eb;padding:8px 10px;z-index:1001;display:flex;align-items:center;gap:10px;backdrop-filter:saturate(120%) blur(4px)}#legend .title{font-size:13px;font-weight:600;white-space:nowrap}#legend .items{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;flex:1}#legend .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid #e5e7eb;border-radius:999px;background:#fff;font-size:12px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.06)}#legend .sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:0 0 auto}.iconbox{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center}.iconbox svg{display:block}.pticon{display:inline-flex;align-items:center;justify-content:center}.leaflet-bottom{bottom:56px}@media(max-width:720px){.auth input{width:130px}.authStatus{width:100%}#banner{top:104px}}@media(max-width:520px){#legend{padding:6px 8px}.leaflet-bottom{bottom:50px}}
    #toolWrap{display:none;height:100%;flex-direction:column}#toolFrame{border:0;width:100%;height:100%}.toolNote{padding:10px;background:var(--panel);border-top:1px solid var(--border);color:var(--muted);font-size:13px}.toolNote a{color:#a7f3d0;text-decoration:none}.adminBox{display:none;gap:8px;align-items:center}.adminBox.show{display:flex}.adminBox button{background:#b91c1c;border-color:#b91c1c;color:#fff}
  .hidden{display:none!important}
  </style>
</head>
<body>
<div id="app">
  <div class="tabs">
    <button class="tab active" id="tabMap">Mapa</button><button class="tab" id="tabTool">Tool</button>
    <div class="spacer"></div>
    <div class="auth">
      <input id="email" type="email" placeholder="e-mail"><input id="password" type="password" placeholder="heslo">
      <button id="loginBtn" class="primary">Přihlásit</button><button id="registerBtn">Registrovat</button><button id="logoutBtn" class="danger hidden">Odhlásit</button>
      <span id="authStatus" class="authStatus">Nepřihlášeno</span>
      <span id="adminBox" class="adminBox"><button id="deleteSelectedBtn" disabled>Smazat vybraný bod/úsek</button></span>
    </div>
  </div>
  <section id="viewerWrap"><div id="map"></div><div id="banner">Načítám data ze Supabase…</div><div id="legend"><div class="title">Legenda</div><div class="items" id="legendItems"></div></div></section>
  <section id="toolWrap"><iframe id="toolFrame" src="./tool.html" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-popups"></iframe><div class="toolNote">Tool běží odděleně, ale používá stejný Supabase login. <a href="./tool.html" target="_blank" rel="noopener">Otevřít Tool v nové záložce</a>.</div></section>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://sjmylzrhqrwoggowimtq.supabaseClient.co";
const SUPABASE_ANON_KEY = "sb_publishable_F3RaL5kYzaJY8iHzLxRKpw_R3lJGLvf";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const tabMap=document.getElementById('tabMap'),tabTool=document.getElementById('tabTool'),viewerWrap=document.getElementById('viewerWrap'),toolWrap=document.getElementById('toolWrap');
function activate(tab){ if(tab==='map'){tabMap.classList.add('active');tabTool.classList.remove('active');viewerWrap.style.display='flex';toolWrap.style.display='none';setTimeout(()=>{map.invalidateSize();updateAllIcons();},50)}else{tabTool.classList.add('active');tabMap.classList.remove('active');viewerWrap.style.display='none';toolWrap.style.display='flex'}}
tabMap.onclick=()=>activate('map'); tabTool.onclick=()=>activate('tool');
const email=document.getElementById('email'),password=document.getElementById('password'),loginBtn=document.getElementById('loginBtn'),registerBtn=document.getElementById('registerBtn'),logoutBtn=document.getElementById('logoutBtn'),authStatus=document.getElementById('authStatus'),adminBox=document.getElementById('adminBox'),deleteSelectedBtn=document.getElementById('deleteSelectedBtn');
let currentUser=null,isAdmin=false,selectedFeatureId=null;
async function refreshSession(){ const {data:{user}}=await supabaseClient.auth.getUser(); currentUser=user; logoutBtn.classList.toggle('hidden',!user); loginBtn.classList.toggle('hidden',!!user); registerBtn.classList.toggle('hidden',!!user); email.classList.toggle('hidden',!!user); password.classList.toggle('hidden',!!user); if(!user){isAdmin=false;authStatus.textContent='Nepřihlášeno';adminBox.classList.remove('show');return} const {data:profile}=await supabaseClient.from('profiles').select('role,display_name,email').eq('id',user.id).single(); isAdmin=profile?.role==='admin'; authStatus.textContent=`${profile?.display_name||user.email}${isAdmin?' · admin':''}`; adminBox.classList.toggle('show',isAdmin); deleteSelectedBtn.disabled=!(isAdmin&&selectedFeatureId); }
loginBtn.onclick=async()=>{const {error}=await supabaseClient.auth.signInWithPassword({email:email.value.trim(),password:password.value}); if(error) return showBanner(error.message,true); await refreshSession(); showBanner('Přihlášeno ✔')};
registerBtn.onclick=async()=>{const {error}=await supabaseClient.auth.signUp({email:email.value.trim(),password:password.value}); if(error) return showBanner(error.message,true); await refreshSession(); showBanner('Registrace hotová. Možná bude potřeba potvrdit e-mail.')};
logoutBtn.onclick=async()=>{await supabaseClient.auth.signOut(); await refreshSession(); showBanner('Odhlášeno')}; supabaseClient.auth.onAuthStateChange(()=>refreshSession());
const map=L.map('map').setView([50.0755,14.4378],13); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap přispěvatelé'}).addTo(map);
const dbLayer=L.featureGroup().addTo(map),iconsLayer=new L.FeatureGroup().addTo(map); const lineLayers=[]; const layerById=new Map();
const ICON_SVGS={dot:'<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3.2" fill="#fff" stroke="#111" stroke-width="1.3"/></svg>',square:'<svg width="16" height="16" viewBox="0 0 16 16"><rect x="4.2" y="4.2" width="7.6" height="7.6" fill="#fff" stroke="#111" stroke-width="1.3"/></svg>',diamond:'<svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 2 L14 8 L8 14 L2 8 Z" fill="#fff" stroke="#111" stroke-width="1.3"/></svg>',triangle:'<svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 3 L13 13 H3 Z" fill="#fff" stroke="#111" stroke-width="1.3"/></svg>',star:'<svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 2 L9.9 6.5 L15 6.5 L10.7 9.6 L12.5 14 L8 11.2 L3.5 14 L5.3 9.6 L1 6.5 L6.1 6.5 Z" fill="#fff" stroke="#111" stroke-width="1.1"/></svg>',stairs:'<svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 12 H12 V10 H10 V8 H8 V6 H6 V4 H4 Z" fill="#fff" stroke="#111" stroke-width="1.1"/></svg>',brick:'<svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="4" width="12" height="8" fill="#fff" stroke="#111" stroke-width="1"/><path d="M2 8 H14 M6 4 V8 M10 8 V12" stroke="#111" stroke-width="1"/></svg>',plank:'<svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 5 H14 M2 8 H14 M2 11 H14" stroke="#111" stroke-width="1.6"/></svg>',pebble:'<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="5" cy="8" r="2.4" fill="#fff" stroke="#111" stroke-width="1"/><circle cx="11" cy="6" r="1.9" fill="#fff" stroke="#111" stroke-width="1"/><circle cx="11" cy="11" r="1.5" fill="#fff" stroke="#111" stroke-width="1"/></svg>'};
const POINT_COLOR="#ef4444"; const POINT_ICONS={warning:'<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M12 3L2.5 20h19L12 3z" fill="white" stroke="currentColor" stroke-width="2"/><path d="M12 8v6M12 18h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',speed_bump:'<svg viewBox="0 0 24 24" width="100%" height="100%"><circle cx="12" cy="12" r="9" fill="white" stroke="currentColor" stroke-width="2"/><path d="M6 14c2-3 10-3 12 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="5" y1="14" x2="19" y2="14" stroke="currentColor" stroke-width="2"/></svg>',zavora:'<svg viewBox="0 0 24 24" width="100%" height="100%"><rect x="4" y="15" width="3" height="6" fill="white" stroke="currentColor" stroke-width="2"/><rect x="17" y="15" width="3" height="6" fill="white" stroke="currentColor" stroke-width="2"/><rect x="5" y="9" width="14" height="4" rx="1" fill="white" stroke="currentColor" stroke-width="2"/><path d="M6 9.5 L9 12.5 M9 9.5 L12 12.5 M12 9.5 L15 12.5 M15 9.5 L18 12.5" stroke="currentColor" stroke-width="2"/></svg>',railcross:'<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M5 5 L19 19" stroke="white" stroke-width="6" stroke-linecap="round"/><path d="M19 5 L5 19" stroke="white" stroke-width="6" stroke-linecap="round"/><path d="M5 5 L19 19" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M19 5 L5 19" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>',pin:'<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M12 22s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z" fill="white" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="2.5" fill="currentColor"/></svg>'};
let surfaces=[{name:'asfalt',icon:'dot',repeat:28},{name:'dlažba / kostky',icon:'brick',repeat:28},{name:'štěrk / prach',icon:'pebble',repeat:28},{name:'schody',icon:'stairs',repeat:32},{name:'dřevo / lávka',icon:'plank',repeat:32},{name:'hlína',icon:'triangle',repeat:30}];
let qualities=[{name:'hladký',color:'#22c55e'},{name:'ok',color:'#f59e0b'},{name:'výtluky',color:'#ef4444'},{name:'nebezpečí',color:'#111827'}];
function qualitiesByName(){return Object.fromEntries(qualities.map(q=>[q.name,q]))} function surfacesByName(){return Object.fromEntries(surfaces.map(s=>[s.name,s]))} function colorForQuality(q){return qualitiesByName()[q]?.color||'#38bdf8'} function iconFor(k){return L.divIcon({html:ICON_SVGS[k]||ICON_SVGS.dot,className:'',iconSize:[16,16],iconAnchor:[8,8]})}
function pointDivIcon(props){const size=Math.max(16,Math.min(48,Number(props.pointSize||24)));const key=props.pointIcon||'warning';const svg=POINT_ICONS[key]||POINT_ICONS.warning;return L.divIcon({html:`<div class="pticon" style="width:${size}px;height:${size}px;color:${POINT_COLOR}">${svg}</div>`,className:'',iconSize:[size,size],iconAnchor:[size/2,size/2]})}
function styleFor(f){const p=f.properties||{}; if(f.geometry&&f.geometry.type==='Point')return{}; return {color:p.color||colorForQuality(p.quality),weight:Number(p.width??6),opacity:.95}}
function fmtCreated(iso){try{if(!iso)return'';const d=new Date(iso);if(isNaN(d))return'';return d.toLocaleDateString('cs-CZ',{month:'long',year:'numeric'})}catch{return''}}
function showBanner(msg,isError=false){const b=document.getElementById('banner'); if(!b)return; b.textContent=msg; b.className=isError?'error':''; if(!isError)setTimeout(()=>{if(b.textContent===msg)b.textContent=''},1800)}
function selectDbFeature(id){selectedFeatureId=id;deleteSelectedBtn.disabled=!(isAdmin&&selectedFeatureId); if(isAdmin)showBanner('Vybráno pro smazání')}
function placeIconsForLine(lineLayer){if(lineLayer._iconMarkers){lineLayer._iconMarkers.forEach(m=>iconsLayer.removeLayer(m));lineLayer._iconMarkers=null}const f=lineLayer.feature||lineLayer.toGeoJSON(),p=f.properties||{},sMap=surfacesByName();let surf=sMap[p.surface]||{name:p.surface||'povrch',icon:p.surfaceIcon||'dot',repeat:Number(p.surfaceRepeat||28)};const repeat=Math.max(8,Number(surf.repeat||28)),icon=iconFor(surf.icon),pts=lineLayer.getLatLngs().flat?lineLayer.getLatLngs().flat():lineLayer.getLatLngs();if(!pts||pts.length<2)return;const pix=pts.map(ll=>map.latLngToLayerPoint(ll));let segLens=[],total=0;for(let i=0;i<pix.length-1;i++){const len=Math.hypot(pix[i+1].x-pix[i].x,pix[i+1].y-pix[i].y);segLens.push(len);total+=len}if(total<4)return;const markers=[];for(let d=0;d<=total;d+=repeat){let acc=0,k=-1;for(let i=0;i<segLens.length;i++){if(acc+segLens[i]>=d){k=i;break}acc+=segLens[i]}if(k<0)continue;const A=pix[k],B=pix[k+1],Lseg=segLens[k],t=Lseg?(d-acc)/Lseg:0,ll=map.layerPointToLatLng(L.point(A.x+(B.x-A.x)*t,A.y+(B.y-A.y)*t));const m=L.marker(ll,{icon,interactive:false,keyboard:false});iconsLayer.addLayer(m);markers.push(m)}lineLayer._iconMarkers=markers}
function updateAllIcons(){lineLayers.forEach(l=>placeIconsForLine(l))} map.on('zoomend moveend',updateAllIcons);
function renderLegend(){const wrap=document.getElementById('legendItems');wrap.innerHTML='';qualities.forEach(q=>{const chip=document.createElement('div');chip.className='chip';const sw=document.createElement('span');sw.className='sw';sw.style.background=q.color;chip.appendChild(sw);chip.appendChild(Object.assign(document.createElement('span'),{textContent:q.name}));wrap.appendChild(chip)});surfaces.forEach(s=>{const chip=document.createElement('div');chip.className='chip';const iconbox=document.createElement('span');iconbox.className='iconbox';iconbox.innerHTML=ICON_SVGS[s.icon]||ICON_SVGS.dot;chip.appendChild(iconbox);chip.appendChild(Object.assign(document.createElement('span'),{textContent:s.name}));wrap.appendChild(chip)});[['warning','pozor'],['speed_bump','retardér'],['zavora','závora'],['railcross','přejezd'],['pin','bod']].forEach(([key,label])=>{const chip=document.createElement('div');chip.className='chip';const iconbox=document.createElement('span');iconbox.className='iconbox';iconbox.innerHTML=`<div class="pticon" style="width:18px;height:18px;color:#ef4444">${POINT_ICONS[key]}</div>`;chip.appendChild(iconbox);chip.appendChild(Object.assign(document.createElement('span'),{textContent:label}));wrap.appendChild(chip)})}
function featureFromRow(row){return {type:'Feature',id:row.id,properties:{...(row.properties||{}),dbId:row.id,createdAt:row.created_at,author:row.created_by},geometry:row.geom}}
function removeRow(id){const layer=layerById.get(id);if(!layer)return;if(layer._iconMarkers)layer._iconMarkers.forEach(m=>iconsLayer.removeLayer(m));dbLayer.removeLayer(layer);layerById.delete(id);const idx=lineLayers.indexOf(layer);if(idx>=0)lineLayers.splice(idx,1)}
function addRow(row,fit=false){removeRow(row.id);const feature=featureFromRow(row);const layer=L.geoJSON(feature,{style:styleFor,pointToLayer:(f,latlng)=>L.marker(latlng,{icon:pointDivIcon(f.properties||{})}),onEachFeature:(feature,layer)=>{const p=feature.properties||{},lines=[];const createdStr=fmtCreated(p.createdAt); if(createdStr)lines.push(`<span class="muted">Přidáno: ${createdStr}</span>`); if(feature.geometry.type==='Point'){const lbl=({warning:'pozor',speed_bump:'retardér',zavora:'závora',railcross:'přejezd',pin:'bod'}[p.pointIcon])||'bod';lines.unshift(`<b>${lbl}</b>`)}else{const left=[];if(p.surface)left.push(`<b>${p.surface}</b>`);if(p.quality)left.push(`<span style="color:${colorForQuality(p.quality)}">${p.quality}</span>`);if(left.length)lines.unshift(left.join(' · '))} if(p.tag)lines.push(`<i>${p.tag}</i>`);if(p.note)lines.push(String(p.note).replace(/</g,'&lt;')); if(isAdmin)lines.push('<br><b>Admin:</b> kliknutím vybereš pro smazání.'); if(lines.length)layer.bindPopup(lines.join('<br>')); layer.on('click',()=>selectDbFeature(row.id)); if(layer instanceof L.Polyline && !(layer instanceof L.Polygon)){layer.feature=feature;lineLayers.push(layer);setTimeout(()=>placeIconsForLine(layer),0)}}}).addTo(dbLayer);layerById.set(row.id,layer);if(fit){try{const bb=layer.getBounds();if(bb.isValid())map.fitBounds(bb.pad(.1))}catch{}}}
async function loadRows(){const {data,error}=await supabaseClient.from('map_features').select('*').eq('status','approved').order('created_at',{ascending:false}); if(error){console.error(error);showBanner('Nepodařilo se načíst data ze Supabase.',true);return} iconsLayer.clearLayers();dbLayer.clearLayers();lineLayers.length=0;layerById.clear();data.forEach(r=>addRow(r)); try{const bb=dbLayer.getBounds();if(bb.isValid())map.fitBounds(bb.pad(.1))}catch{} showBanner(`Načteno ${data.length} záznamů ✔`)}
deleteSelectedBtn.onclick=async()=>{if(!isAdmin||!selectedFeatureId)return;if(!confirm('Opravdu smazat vybraný bod/úsek?'))return;const id=selectedFeatureId;const {error}=await supabaseClient.from('map_features').delete().eq('id',id);if(error)return showBanner('Mazání selhalo – nejsi admin nebo RLS blokuje akci.',true);selectedFeatureId=null;deleteSelectedBtn.disabled=true;removeRow(id);showBanner('Smazáno ✔')};
function subscribeRealtime(){supabaseClient.channel('map_features_public').on('postgres_changes',{event:'*',schema:'public',table:'map_features'},payload=>{if(payload.eventType==='DELETE'){removeRow(payload.old.id);return}const row=payload.new;if(row.status==='approved')addRow(row);else removeRow(row.id)}).subscribe()}
renderLegend();
(async function startApp(){
  const watchdog = setTimeout(() => {
    const b = document.getElementById('banner');
    if (b && b.textContent.includes('Načítám')) {
      b.textContent = 'Načítání trvá moc dlouho – zkontroluj Network/Console, případně Supabase URL/key.';
      b.className = 'error';
    }
  }, 10000);
  try {
    showBanner('Připojuji se k Supabase…');
    await refreshSession();
    showBanner('Načítám záznamy z databáze…');
    await loadRows();
    subscribeRealtime();
  } catch (err) {
    console.error('Start aplikace selhal:', err);
    showBanner('Chyba startu aplikace: ' + (err?.message || err), true);
  } finally {
    clearTimeout(watchdog);
  }
})();
</script>
</body>
</html>
